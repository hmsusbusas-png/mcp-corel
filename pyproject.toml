[project]
name = "mcp-corel"
version = "1.0.0"
description = "MCP server that drives CorelDRAW through COM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "pywin32>=306",
]

[project.scripts]
mcp-corel = "corelmcp.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corelmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs installed desktop software, a real server or internet"]
addopts = "-m 'not live'"
