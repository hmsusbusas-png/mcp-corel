[project]
name = "corelmcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "pywin32"]

[project.scripts]
corel-mcp = "corelmcp.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corelmcp"]
